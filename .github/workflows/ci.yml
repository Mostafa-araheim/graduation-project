name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Job 1: Build & Test
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./pharma

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: ./pharma/pom.xml

    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Build and Test with Maven
      run: ./mvnw clean package

  # Job 2: Docker Build & Push
  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./pharma
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/pharma-backend:latest

  # Job 3: Deploy to VPS
  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Deploy to VPS using SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # الأوامر دي هتشتغل على سيرفر صاحبك
          # 1. بنروح للفولدر اللي فيه المشروع على السيرفر
          cd /path/to/your/project/pharma
          
          # 2. بنعمل تسجيل دخول لدوكر عشان نقدر نسحب الصورة لو كانت private
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
          # 3. بنسحب أحدث نسخة من الصورة اللي لسة مرفوعة في الخطوة اللي قبلها
          docker-compose pull
          
          # 4. بنرستر الكونتينرز عشان تشتغل بالنسخة الجديدة
          docker-compose up -d --remove-orphans