name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # بيحدد إن كل أوامر الـ run تتنفذ جوة فولدر pharma تلقائياً
    defaults:
      run:
        working-directory: pharma

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'pharma/pom.xml'
    
    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Build and Test with Maven
      run: ./mvnw clean package

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test Docker Build
      uses: docker/build-push-action@v5
      with:
        context: ./pharma
        push: false
        tags: pharma-backend:test