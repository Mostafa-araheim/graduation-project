<!-- Simple solid background - matches React design best -->
<nav class="sticky top-0 z-50 w-full border-b border-border bg-card">
    <div class="container mx-auto px-4">
        <div class="flex h-16 items-center justify-between gap-4">
            <!-- Logo -->
            <a routerLink="/" class="flex items-center gap-2 shrink-0" (click)="closeMenu()">
                <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary">
                    <!-- <i-lucide [name]="pillIcon" class="h-5 w-5 text-primary-foreground"></i-lucide> -->
                    <lucide-icon [name]="pillIcon" class="h-5 w-5 text-primary-foreground"></lucide-icon>
                </div>
                <span class="text-xl font-bold text-foreground hidden sm:block">
                    MediConnect
                </span>
            </a>

            <!-- Search Bar - Desktop -->


            <!-- Desktop Navigation -->
            <div class="hidden lg:flex items-center gap-1">
                @for (link of navLinks; track link.href) {
                @if (!((link.label === 'Sell Medicine' || link.label === 'Upload Prescription') &&
                !authService.isLogin())) {
                <a [routerLink]="link.href">
                    <button [class]="isActive(link.href)
          ? 'bg-primary-light text-primary'
          : 'text-foreground hover:bg-muted hover:text-foreground'"
                        class="px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
                        {{ link.label }}
                    </button>
                </a>
                }
                }
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-3">
                <a routerLink="/cart" class="hidden sm:block">
                    <button
                        class="p-2 rounded-md text-foreground hover:bg-muted transition-colors duration-200 relative">
                        <i-lucide [name]="shoppingCartIcon" class="h-5 w-5"></i-lucide>
                        @if (cartService.cartCount() > 0) {
                        <span
                            class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-accent text-xs text-accent-foreground">
                            {{ cartService.cartCount() }}
                        </span>
                        }
                        @else {
                        <span
                            class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-accent text-xs text-accent-foreground">
                            0
                        </span>
                        }
                    </button>
                </a>




                @if(!authService.isLogin())
                {



                <a routerLink="/signup" class="hidden sm:block">
                    <button
                        class="px-4 py-2 rounded-md bg-primary text-primary-foreground hover:bg-primary/90 text-sm font-medium transition-colors duration-200">
                        Sign Up
                    </button>
                </a>


                <a routerLink="/signin" class="hidden sm:block">
                    <button
                        class="px-4 py-2 rounded-md bg-primary text-primary-foreground hover:bg-primary/90 text-sm font-medium transition-colors duration-200">
                        Sign In
                    </button>
                </a>
                }
                @else {


                <a routerLink="/profile" class="hidden sm:block">
                    <button class="p-2 rounded-md text-foreground hover:bg-muted transition-colors duration-200">
                        <i-lucide [name]="userIcon" class="h-5 w-5"></i-lucide>
                    </button>
                </a>

                <a class="hidden sm:block">
                    <button
                        class="px-4 py-2 rounded-md bg-red-500 text-white hover:bg-red-400 text-sm font-medium transition-colors duration-200"
                        (click)="authService.logout()">

                        LogOut
                    </button>
                </a>
                }
                <!-- Mobile Menu Toggle -->
                <button
                    class="p-2 rounded-md text-foreground hover:bg-muted transition-colors duration-200 lg:hidden menu-toggle"
                    (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Toggle menu">
                    @if (isMenuOpen) {
                    <i-lucide [name]="xIcon" class="h-5 w-5"></i-lucide>
                    } @else {
                    <i-lucide [name]="menuIcon" class="h-5 w-5"></i-lucide>
                    }
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        @if (isMenuOpen) {
        <div class="lg:hidden py-4 border-t border-border animate-fade-in mobile-menu bg-card">
            <!-- Mobile Search -->
            @if (!isLanding) {
            <div class="relative mb-4">
                <i-lucide [name]="searchIcon"
                    class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"></i-lucide>
                <input type="text" placeholder="Search medicines, pharmacies..."
                    class="w-full pl-10 pr-4 py-2 rounded-md bg-muted/50 border-0 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 focus:ring-offset-background transition-colors" />
            </div>
            }

            <div class="flex flex-col gap-2">
                @for (link of navLinks; track link.href) {
                <a [routerLink]="link.href" (click)="closeMenu()">
                    <button
                        [class]="isActive(link.href) ? 'bg-primary-light text-primary' : 'text-foreground hover:bg-muted hover:text-foreground'"
                        class="w-full px-3 py-2 rounded-md text-sm font-medium text-left transition-colors duration-200">
                        {{ link.label }}
                    </button>
                </a>
                }

                <div class="flex gap-2 mt-4 pt-4 border-t border-border">
                    <a routerLink="/login" class="flex-1" (click)="closeMenu()">
                        <button
                            class="w-full px-4 py-2 rounded-md border border-primary text-primary hover:bg-primary hover:text-primary-foreground text-sm font-medium transition-colors duration-200">
                            Login
                        </button>
                    </a>
                    <a routerLink="/register" class="flex-1" (click)="closeMenu()">
                        <button
                            class="w-full px-4 py-2 rounded-md bg-primary text-primary-foreground hover:bg-primary/90 text-sm font-medium transition-colors duration-200">
                            Sign Up
                        </button>
                    </a>
                </div>
            </div>
        </div>
        }
    </div>
</nav>
