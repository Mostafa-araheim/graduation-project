  <div class="flex flex-col items-center justify-center gap-4 text-center">
    <!-- Branded Spinner -->
    <div class="h-16 w-16 rounded-2xl border-2 border-primary/30 border-t-primary animate-spin"></div>

<!-- Normal Loading (no full screen) -->
<div class="flex flex-col items-center justify-center gap-4 text-center">
  <!-- Branded Spinner -->
  <div class="h-16 w-16 rounded-2xl border-2 border-primary/30 border-t-primary animate-spin"></div>
  
  <!-- Loading Message -->
  <p class="text-sm font-medium text-muted-foreground animate-pulse">
    Loading...
  </p>
</div>

<!-- Top Loading Bar -->
<div class="fixed top-0 left-0 right-0 z-[9999] h-1 bg-transparent pointer-events-none">
  <div class="h-full bg-primary shadow-[0_0_10px_hsl(var(--primary))] transition-all duration-300 ease-out" style="width: 45%"></div>
</div>
