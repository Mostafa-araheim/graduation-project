events {
    # يحدد أقصى عدد من الاتصالات المتزامنة التي يمكن لـ worker واحد التعامل معها
    worker_connections 1024;
}

http {
    # ==========================================
    # 1. إعدادات ضغط البيانات (Gzip Compression)
    # ==========================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==========================================
    # 2. إعدادات تحديد الطلبات (Rate Limiting)
    # ==========================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ==========================================
    # 3. إعدادات الأمان (Security Headers)
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ==========================================
    # 4. تعريف الخوادم الخلفية (Upstream Block)
    # ==========================================
    # في الإنتاج مع Docker، كلمة "app" يتم حلها (DNS Resolution)
    # داخلياً لكل الـ Replicas التي حددناها في docker-compose
    upstream springboot_backend {
        server app:8080;
    }

    # إعادة التوجيه من HTTP إلى HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # السيرفر الأساسي المشفر
    server {
        listen 443 ssl;
        server_name localhost;

        # إعدادات الشهادة
        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # تطبيق الـ Rate Limit 
            limit_req zone=api_limit burst=5 nodelay;

            # التوجيه إلى الـ upstream الذي يوزع الحمل
            proxy_pass http://springboot_backend;
            
            # ==========================================
            # 5. إعدادات مهلات الاتصال (Timeouts)
            # ==========================================
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # تمرير المعلومات الصحيحة
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
