events {
    worker_connections 1024;
}

http {
    # ==========================================
    # 1. إعدادات ضغط البيانات (Gzip Compression)
    # ==========================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==========================================
    # 2. إعدادات تحديد الطلبات (Rate Limiting)
    # ==========================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ==========================================
    # 3. إعدادات الأمان (Security Headers)
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ==========================================
    # 4. تعريف الخوادم الخلفية (Upstream Block)
    # ==========================================
    # يقوم Docker DNS تلقائياً بتوزيع الحمل (Round-Robin) بين الـ 2 Replicas لخدمة app
    upstream springboot_backend {
        server app:8080;
    }

    # السيرفر الأساسي (HTTP)
    server {
        listen 80;
        server_name localhost;

        location / {
            # تطبيق الـ Rate Limit
            limit_req zone=api_limit burst=5 nodelay;

            # التوجيه إلى اسم الـ upstream
            proxy_pass http://springboot_backend;
            
            # ==========================================
            # 5. إعدادات مهلات الاتصال (Timeouts)
            # ==========================================
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # تمرير الهيدرز الصحيحة للتطبيق
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}