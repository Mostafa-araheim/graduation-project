spring:
  application:
    name: pharma
    frontend:
      url: frontendurl
    jwt:
      secret: XXXXX

  datasource:
    url: jdbc:postgresql://localhost:5432/Pharma
    username: postgres
    password: XXXXX
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: XXXXX
            client-secret: XXXXXX
            scope:
              - email
              - profile
              - openid

  mail:
    host: smtp.gmail.com
    port: 587
    username: mostafa.araheim@gmail.com
    password: XXXXXXXXX
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

ors:
  apiKey: XXXXXXXXXXXXX

stripe:
  secret-key: XXXXXXXXXXXXXXXXX
  publishable-key: XXXXXXXXXXXXXXXXXX
  webhook-secret: XXXXXX

app:
  frontend:
    success-url: http://localhost:4200/profile
    cancel-url: http://localhost:4200/cancel

api:
  openai:
    key: XXXXXXXXXX
  gemini:
    key: XXXXXXXX

server:
  tomcat:
    max-part-count: 50

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: always