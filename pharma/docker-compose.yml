version: '3.8'

services:
  app:
    build: .
    image: pharma-app
    container_name: pharma_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=container
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pharma_network
    restart: unless-stopped

  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: pharma_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=Pharma
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-5519}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Pharma"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pharma_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pharma_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pharma_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pharma_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - pharma_network
    restart: unless-stopped

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: pharma_stripe_cli
    command: listen --forward-to app:8080/api/v1/payments/stripe/webhook
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - app
    networks:
      - pharma_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  pharma_network:
    driver: bridge
